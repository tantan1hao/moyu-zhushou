name: MoyuAssistant
options:
  minimumXcodeGenVersion: 2.45.3
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    CLANG_ENABLE_OBJC_ARC: YES
    CODE_SIGN_STYLE: Automatic
targets:
  NovelIMECore:
    type: library.static
    platform: macOS
    sources:
      - path: NativeIME/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tantan1hao.moyuassistant.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGNING_ALLOWED: NO
  MoyuAssistant:
    type: application
    platform: macOS
    sources:
      - path: NativeIME/HostApp
      - path: NativeIME/InputMethodExtension
        excludes:
          - Info.plist
          - MoyuInputMethodExtension.entitlements
      - path: NativeIME/Resources/moyu_input.tiff
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tantan1hao.inputmethod.moyuassistant
        INFOPLIST_FILE: NativeIME/HostApp/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        CODE_SIGN_ENTITLEMENTS: NativeIME/HostApp/MoyuAssistant.entitlements
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - target: NovelIMECore
  NovelIMECoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NativeIME/CoreTests
    dependencies:
      - target: NovelIMECore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tantan1hao.moyuassistant.coretests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  NovelIMECore:
    build:
      targets:
        NovelIMECore: all
        NovelIMECoreTests: test
    test:
      targets:
        - name: NovelIMECoreTests
  MoyuAssistant:
    build:
      targets:
        MoyuAssistant: all
