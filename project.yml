name: MoyuAssistant
options:
  minimumXcodeGenVersion: 2.45.3
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    CLANG_ENABLE_OBJC_ARC: YES
    CODE_SIGN_STYLE: Automatic
targets:
  NovelIMECore:
    type: framework
    platform: macOS
    sources:
      - path: NativeIME/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tantan1hao.moyuassistant.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGNING_ALLOWED: NO
  MoyuAssistant:
    type: application
    platform: macOS
    sources:
      - path: NativeIME/HostApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tantan1hao.moyuassistant
        INFOPLIST_FILE: NativeIME/HostApp/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    dependencies:
      - target: NovelIMECore
      - target: MoyuInputMethodExtension
        embed: true
  MoyuInputMethodExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: NativeIME/InputMethodExtension
    dependencies:
      - target: NovelIMECore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tantan1hao.moyuassistant.inputmethod
        INFOPLIST_FILE: NativeIME/InputMethodExtension/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../Frameworks"
  NovelIMECoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NativeIME/CoreTests
    dependencies:
      - target: NovelIMECore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tantan1hao.moyuassistant.coretests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  NovelIMECore:
    build:
      targets:
        NovelIMECore: all
        NovelIMECoreTests: test
    test:
      targets:
        - name: NovelIMECoreTests
  MoyuAssistant:
    build:
      targets:
        MoyuAssistant: all
